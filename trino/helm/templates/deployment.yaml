apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "trino.fullname" . }}
  labels:
    {{- include "trino.labels" . | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Chart.Name }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      # Ініціалізуючий контейнер для імпорту сертифіката у Truststore
      initContainers:
        - name: import-cert
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command:
            - /bin/sh
            - -c
            - |
              echo "Preparing custom truststore..."
              # Знаходимо де лежить оригінальний cacerts в образі Trino та копіюємо його в спільну emptyDir директорію
              ORIG_CACERTS=$(find /usr -name cacerts 2>/dev/null | head -n 1)
              if [ -z "$ORIG_CACERTS" ]; then
                ORIG_CACERTS=$(find /etc -name cacerts 2>/dev/null | head -n 1)
              fi
              echo "Found original cacerts at: $ORIG_CACERTS"
              cp "$ORIG_CACERTS" /tmp/custom-cacerts
              
              # Імпортуємо наш S3 SSL сертифікат
              echo "Importing s3-lb.pem into truststore..."
              keytool -importcert \
                -alias s3-lb \
                -file /certs/s3-lb.pem \
                -keystore /tmp/custom-cacerts \
                -storepass changeit \
                -noprompt
              
              echo "Truststore successfully generated!"
          volumeMounts:
            - name: s3-ca-volume
              mountPath: /certs
            - name: truststore-volume
              mountPath: /tmp
      containers:
        - name: trino
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            # Передаємо змінні доступу до S3 з секрету в контейнер
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: {{ .Values.s3.accessKeyKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.secretName }}
                  key: {{ .Values.s3.secretKeyKey }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            httpGet:
              path: /v1/info
              port: 8080
            initialDelaySeconds: 25
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    (
                      echo "=== Starting background Trino initialization ==="
                      
                      for i in $(seq 1 60); do
                        # 1. Перевіряємо, чи відповідає API взагалі
                        if curl -s http://localhost:8080/v1/info > /tmp/trino_info.json 2>&1; then
                          
                          # 2. Перевіряємо, чи завершилася внутрішня ініціалізація (starting: false)
                          if grep -q '"starting":true' /tmp/trino_info.json; then
                            echo "Trino port is open, but server is still initializing... (attempt $i/60)"
                          else
                            echo "Trino server is FULLY UP and READY! Running DDL statements..."
                            sleep 2
                            
                            trino --server http://localhost:8080 --user admin --execute "CREATE SCHEMA IF NOT EXISTS minio.audit;"
                            
                            # Створюємо таблицю локально в метасторі
                            trino --server http://localhost:8080 --user admin --execute "CREATE TABLE IF NOT EXISTS minio.audit.events (id varchar, timestamp varchar, action varchar, user_id varchar, payload varchar) WITH (format = 'PARQUET');"
                            
                            echo "=== Initialization completed successfully ==="
                            break
                          fi
                        else
                          echo "Waiting for Trino port 8080 to open... (attempt $i/60)"
                        fi
                        sleep 5
                      done
                    ) > /tmp/init.log 2>&1 &
          
          volumeMounts:
            - name: trino-config
              mountPath: /etc/trino/config.properties
              subPath: config.properties
            - name: trino-config
              mountPath: /etc/trino/node.properties
              subPath: node.properties
            - name: trino-config
              mountPath: /etc/trino/jvm.config
              subPath: jvm.config
            - name: catalog
              mountPath: /etc/trino/catalog
            - name: trino-data
              mountPath: /data/trino
            # Монтуємо Truststore, згенерований в initContainers, у робочий контейнер
            - name: truststore-volume
              mountPath: /tmp
      volumes:
        - name: catalog
          configMap:
            name: {{ include "trino.fullname" . }}-catalog
            defaultMode: 0555
        - name: trino-config
          configMap:
            name: {{ include "trino.fullname" . }}-config
            defaultMode: 0555
        - name: trino-data
          emptyDir: {}
        # Спільне сховище для truststore між init-контейнером та основним Trino
        - name: truststore-volume
          emptyDir: {}
        # Джерело сертифіката (ConfigMap)
        - name: s3-ca-volume
          configMap:
            name: {{ .Values.s3.caConfigMapName }}
