apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "trino.fullname" . }}-catalog
  labels:
    {{- include "trino.labels" . | nindent 4 }}
data:
  minio.properties: |
    connector.name=hive
    hive.metastore=file
    hive.metastore.catalog.dir=/data/trino/metadata
    
    # Конфігурація S3/MinIO інтеграції
    hive.s3.aws-access-key=${ENV:S3_ACCESS_KEY}
    hive.s3.aws-secret-key=${ENV:S3_SECRET_KEY}
    hive.s3.endpoint={{ .Values.s3.endpoint }}
    hive.s3.path-style-access={{ .Values.s3.pathStyleAccess }}
    hive.s3.ssl.enabled=true
