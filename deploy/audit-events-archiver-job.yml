apiVersion: batch/v1
kind: CronJob
metadata:
  name: audit-events-archiver
  namespace: diia-processing
spec:
  schedule: "0 3 * * *" # Кожного дня о 03:00 ночі
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: archiver
              image: harbor.diia.gov.ua/platform/audit-archiver:1.0.0
              imagePullPolicy: IfNotPresent
              env:
                - name: DB_HOST
                  value: "postgres.diia-internal"
                - name: DB_PORT
                  value: "5432"
                - name: DB_NAME
                  value: "audit"
                - name: DB_USER
                  value: "postgres"
                - name: DB_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: audit-db-credentials
                      key: password
                - name: S3_ENDPOINT
                  value: "http://minio.diia-storage:9000"
                - name: S3_BUCKET
                  value: "diia-audit-archive"
                - name: S3_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: access-key
                - name: S3_SECRET_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: secret-key
                - name: RETENTION_DAYS
                  value: "2"
              volumeMounts:
                - name: temp-parquet-storage
                  mountPath: /tmp
              resources:
                requests:
                  memory: "512Mi"
                  cpu: "500m"
                  ephemeral-storage: "1Gi"
                limits:
                  memory: "1Gi" # JVM Heap займе ~512MB, решта під Off-heap буфери Parquet
                  cpu: "1000m"
                  ephemeral-storage: "5Gi"
          volumes:
            - name: temp-parquet-storage
              emptyDir:
                sizeLimit: 5Gi