# ==========================================
# Загальні налаштування образу Trino
# ==========================================
image:
  repository: trinodb/trino
  tag: "435"
  pullPolicy: IfNotPresent

# ==========================================
# Конфігурація ініціалізації
# ==========================================
init:
  enabled: false

# ==========================================
# Налаштування ресурсів (Оптимізовано для плагінів)
# ==========================================
resources:
  requests:
    memory: "1.5Gi"
    cpu: "500m"
  limits:
    memory: "3Gi"
    cpu: "2"

# ==========================================
# Політики безпеки для OpenShift (restricted SCC)
# ==========================================
securityContext:
  runAsNonRoot: true
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
  seccompProfile:
    type: RuntimeDefault

# ==========================================
# Налаштування підключення до S3 / MinIO
# ==========================================
s3:
  endpoint: "https://s3.krrt-ncr.loc"
  bucketName: "edu-audit-archive"
  warehouseDir: "s3a://edu-audit-archive/"
  secretName: "edu-audit-archive-secret"
  accessKeyKey: "AccessKey"
  secretKeyKey: "SecretAccessKey"
  pathStyleAccess: true
  # Назва ConfigMap, де зберігається сертифікат s3-lb.pem
  caConfigMapName: "audit-archiver-s3-ca"

# ==========================================
# Конфігурації JVM (Heap узгоджено з limits)
# ==========================================
jvm:
  maxHeapSize: "2048M"
  gcMethod: "-XX:+UseG1GC"

networkPolicy:
  enabled: true
