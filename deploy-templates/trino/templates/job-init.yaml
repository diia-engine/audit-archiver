{{- if .Values.init.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "trino.fullname" . }}-init
  labels:
    {{- include "trino.labels" . | nindent 4 }}
spec:
  backoffLimit: {{ .Values.init.backoffLimit }}
  ttlSecondsAfterFinished: {{ .Values.init.ttlSecondsAfterFinished }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Chart.Name }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: trino-init
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          env:
            - name: TRINO_USER
              value: admin
            - name: JVM_ARGS
              value: "-Xmx512M -Xms512M"
          resources:
            requests:
              memory: "512Mi"
              cpu: "200m"
            limits:
              memory: "1Gi"
              cpu: "1000m"
          command:
            - /bin/sh
            - -c
            - |
              set -ex
              echo "Starting connection check using synchronized labels..."
              
              FULL_SVC_HOST="{{ include "trino.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
              
              until curl -sI http://${FULL_SVC_HOST}:8080/v1/info > /dev/null 2>&1; do
                echo "Trino Service endpoint is not routed yet. Sleeping 5 seconds..."
                sleep 5
              done
              
              echo "Route established! Executing SQL schema initialization..."
              trino --server http://${FULL_SVC_HOST}:8080 --user admin -f /init/init-trino.sql
              
              echo "Initialization completed successfully."
          volumeMounts:
            - name: init-sql
              mountPath: /init
      volumes:
        - name: init-sql
          configMap:
            name: {{ include "trino.fullname" . }}-init
{{- end }}
