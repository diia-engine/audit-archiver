{{- if .Values.manualJob.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: audit-archiver-cronjob-manual
  labels:
    app.kubernetes.io/name: audit-archiver-manual
spec:
  backoffLimit: {{ .Values.backoffLimit | default 4 }}
  ttlSecondsAfterFinished: {{ .Values.ttlSecondsAfterFinished | default 3600 }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: audit-archiver-manual
        job-name: audit-archiver-cronjob-manual
    spec:
      restartPolicy: OnFailure
      
      initContainers:
        - name: init-truststore
          image: eclipse-temurin:11-jre-alpine
          command:
            - sh
            - -c
            - |
              echo "Копіюємо стандартний cacerts у тимчасову робочу папку..."
              cp /opt/java/openjdk/lib/security/cacerts /tmp/custom-cacerts || \
              cp /usr/local/openjdk-11/lib/security/cacerts /tmp/custom-cacerts || \
              cp /usr/lib/jvm/default-jvm/jre/lib/security/cacerts /tmp/custom-cacerts || \
              cp /etc/ssl/certs/java/cacerts /tmp/custom-cacerts
              
              chmod 644 /tmp/custom-cacerts
              
              echo "Імпортуємо сертифікат s3-lb.pem з ConfigMap..."
              keytool -importcert -noprompt \
                -alias s3-lb-cert \
                -file /certs/s3-lb.pem \
                -keystore /tmp/custom-cacerts \
                -storepass changeit
          volumeMounts:
            - name: ca-cert-volume
              mountPath: /certs
            - name: truststore-volume
              mountPath: /tmp

      containers:
        - name: audit-archiver-manual
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy | default "IfNotPresent" }}
          
          env:
            # === Java Truststore Configuration ===
            - name: JAVA_TOOL_OPTIONS
              value: "-Djavax.net.ssl.trustStore=/tmp/custom-cacerts -Djavax.net.ssl.trustStorePassword=changeit"

            # === Database ===
            - name: DB_HOST
              value: {{ .Values.db.host | quote }}
            - name: DB_PORT
              value: {{ .Values.db.port | quote }}
            - name: DB_NAME
              value: {{ .Values.db.name | quote }}
            - name: DB_SCHEMA
              value: {{ .Values.db.schema | quote }}
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ .Values.db.userKey }}
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.db.existingSecret }}
                  key: {{ .Values.db.passwordKey }}

            # === S3 ===
            - name: S3_ENDPOINT
              value: {{ .Values.s3.endpoint | quote }}
            - name: S3_REGION
              value: {{ .Values.s3.region | quote }}
            - name: S3_BUCKET
              value: {{ .Values.s3.bucket | quote }}
            - name: S3_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.accessKey }}
            - name: S3_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.s3.existingSecret }}
                  key: {{ .Values.s3.secretKey }}

            # === Режим роботи ===
            - name: RETENTION_HOURS
              value: {{ .Values.retentionHours | quote }}
            
            # Жорстко вшиваємо параметр таблиці для ручної джоби
            - name: ARCHIVE_TABLE_NAME
              value: {{ .Values.manualJob.archiveTableName | quote }}

          volumeMounts:
            - name: tmp-parquet
              mountPath: /tmp
            - name: truststore-volume
              mountPath: /tmp/custom-cacerts
              subPath: custom-cacerts
            
      volumes:
        - name: tmp-parquet
          emptyDir:
            sizeLimit: {{ .Values.tmpStorage.sizeLimit | default "1Gi" }}
        - name: ca-cert-volume
          configMap:
            name: audit-archiver-s3-ca
        - name: truststore-volume
          emptyDir: {}
{{- end }}
