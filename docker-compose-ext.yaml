version: '3.8'
name: audit-archiver

services:
  # 1. База даних із pg_partman
  postgres:
    build:
      context: large-data
      dockerfile: Dockerfile.db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_DB: audit
    ports:
      - "5454:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./large-data/init-db.sql:/docker-entrypoint-initdb.d/00-init-db.sql # Сюди покладемо DDL
      - ./large-data/create-audit-event-archive.sql:/docker-entrypoint-initdb.d/10-create-audit-event-archive.sql
      - ./large-data/audit_event_master.tsv:/tmp/data/audit_event_master.tsv
      - ./large-data/audit_event_archive.tsv:/tmp/data/audit_event_archive.tsv
      - ./large-data/import-data.sql:/docker-entrypoint-initdb.d/20-import-data.sql
      - ./large-data/drop-latest-partition.sql:/docker-entrypoint-initdb.d/30-drop-latest-partition.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d audit"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Локальний S3 (MinIO)
  minio:
    image: minio/minio:RELEASE.2023-09-07T02-05-02Z
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_password
    ports:
      - "9000:9000" # API порт
      - "9001:9001" # Web UI порт
    command: server /data --console-address ":9001"
    volumes:
      - miniodata:/data

  minio-init:
    image: minio/mc
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for MinIO to start...';
      until (/usr/bin/mc alias set myminio http://minio:9000 minio_admin minio_password); do 
        echo 'MinIO is unavailable, sleeping...';
        sleep 2; 
      done;
      echo 'MinIO is up! Creating bucket...';
      /usr/bin/mc mb myminio/diia-audit-archive || true;
      echo 'Setup complete.';
      exit 0;
      "

  # --- TRINO (Головний сервер) ---
  trino:
    image: trinodb/trino:435
    ports:
      - "8080:8080"
    volumes:
      - ./trino_conf/catalog:/etc/trino/catalog
    depends_on:
      - minio

  # --- TRINO INIT (Одноразова джоба для створення схем) ---
  trino-init:
    image: trinodb/trino:435
    depends_on:
      - trino
    volumes:
      - ./init-trino.sql:/tmp/init-trino.sql
    command: >
      bash -c "
        echo 'Waiting for Trino server...';
        until trino --server http://trino:8080 --execute 'SELECT 1' > /dev/null 2>&1; do sleep 2; done;
        echo 'Trino is up! Applying DDL schema...';
        trino --server http://trino:8080 -f /tmp/init-trino.sql;
        echo 'Trino initialization completed!';
      "

  # --- REDASH DEPENDENCIES ---
  redis:
    image: redis:7-alpine
    restart: unless-stopped

  redash-postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - redash-db-data:/var/lib/postgresql/data

  # --- REDASH CORE ---
  redash-server:
    image: redash/redash:10.1.0.b50633
    depends_on:
      - redash-postgres
      - redis
    ports:
      - "5000:5000"
    environment:
      PYTHONUNBUFFERED: 0
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_DATABASE_URL: postgresql://postgres@redash-postgres/postgres
      REDASH_COOKIE_SECRET: local-dev-secret
    command: server

  redash-worker:
    image: redash/redash:10.1.0.b50633
    command: worker
    depends_on:
      - redash-server
    environment:
      PYTHONUNBUFFERED: 0
      REDASH_LOG_LEVEL: INFO
      REDASH_REDIS_URL: redis://redis:6379/0
      REDASH_DATABASE_URL: postgresql://postgres@redash-postgres/postgres
      REDASH_COOKIE_SECRET: local-dev-secret
      QUEUES: "queries,scheduled_queries,celery,default,schemas"
      WORKERS_COUNT: 2

volumes:
  pgdata:
  miniodata:
  redash-db-data: